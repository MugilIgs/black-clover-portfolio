<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Asta's 5-leaf black clover (red) -->
  <g fill="#ff244f">
    <!-- Leaf 1: top -->
    <ellipse cx="50" cy="27" rx="13" ry="21"/>
    <!-- Leaf 2: upper-right -->
    <ellipse cx="72" cy="43" rx="13" ry="21" transform="rotate(72 72 43)"/>
    <!-- Leaf 3: lower-right -->
    <ellipse cx="64" cy="68" rx="13" ry="21" transform="rotate(144 64 68)"/>
    <!-- Leaf 4: lower-left -->
    <ellipse cx="36" cy="68" rx="13" ry="21" transform="rotate(216 36 68)"/>
    <!-- Leaf 5: upper-left -->
    <ellipse cx="28" cy="43" rx="13" ry="21" transform="rotate(288 28 43)"/>
  </g>
  <!-- Stem -->
  <path d="M50 50 C54 66 53 81 40 91" fill="none" stroke="#ff244f" stroke-width="5" stroke-linecap="round"/>
</svg>
