<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Red 4-leaf clover -->
  <!-- Top leaf -->
  <ellipse cx="50" cy="32" rx="14" ry="18" fill="#e8192c" transform="rotate(0 50 50)"/>
  <!-- Right leaf -->
  <ellipse cx="68" cy="50" rx="14" ry="18" fill="#c0001e" transform="rotate(90 50 50)"/>
  <!-- Bottom leaf -->
  <ellipse cx="50" cy="68" rx="14" ry="18" fill="#e8192c" transform="rotate(180 50 50)"/>
  <!-- Left leaf -->
  <ellipse cx="32" cy="50" rx="14" ry="18" fill="#c0001e" transform="rotate(270 50 50)"/>
  <!-- Center -->
  <circle cx="50" cy="50" r="10" fill="#ff2a3c"/>
  <!-- Stem -->
  <rect x="47" y="72" width="6" height="16" rx="3" fill="#a00016"/>
  <!-- Leaf shine highlights -->
  <ellipse cx="46" cy="30" rx="4" ry="7" fill="#ff6b7a" opacity="0.5"/>
  <ellipse cx="70" cy="46" rx="4" ry="7" fill="#ff6b7a" opacity="0.4" transform="rotate(90 68 50)"/>
</svg>
